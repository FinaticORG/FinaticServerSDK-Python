name: CI

on:
  pull_request:
    branches: [main, develop, staging, fdx-account-consent-v1]


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Skip heavy CI for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Skipping heavy product CI for Dependabot (Actions cost control)."
      - uses: actions/checkout@v7
        if: github.actor != 'dependabot[bot]'

      - uses: actions/setup-python@v7
        if: github.actor != 'dependabot[bot]'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        if: github.actor != 'dependabot[bot]'
        with:
          enable-cache: true

      - name: Install package with dev dependencies
        if: github.actor != 'dependabot[bot]'
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Compile package
        if: github.actor != 'dependabot[bot]'
        run: uv run python -m compileall finatic_server_python src tests

      - name: Run unit tests with coverage gate
        if: github.actor != 'dependabot[bot]'
        run: >
          uv run pytest -q -m "not integration"
          --cov=src
          --cov=finatic_server_python
          --cov-report=term-missing:skip-covered
          --cov-fail-under=50

      - name: Build package
        if: github.actor != 'dependabot[bot]'
        run: uv run python -m build
