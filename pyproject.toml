[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finatic-server-python"
version = "1.0.3"
description = "Python SDK for Finatic Server API"
authors = [{ name = "Finatic", email = "support@finatic.dev" }]
license = { text = "PROPRIETARY" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
keywords = ["finatic", "trading", "finance", "api", "sdk"]
dependencies = [
    "aiohttp-retry>=2.9.1",
    "aiohttp>=3.14.3",
    "cachetools>=7.1.7",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "typing-extensions>=4.16.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=8.0.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pre-commit>=3.0.0",
    "build>=1.5.0",
    "types-cachetools>=5.3.0",
    "types-python-dateutil>=2.9.0.20260807",
]
integration = ["psycopg[binary]>=3.3.4"]

[project.urls]
Homepage = "https://github.com/FinaticORG/FinaticServerSDK-Python"
Documentation = "https://docs.finatic.com/python"
Repository = "https://github.com/FinaticORG/FinaticServerSDK-Python"
Issues = "https://github.com/FinaticORG/FinaticServerSDK-Python/issues"

[tool.hatch.build.targets.wheel]
packages = ["finatic_server_python", "finatic_server", "src"]
include = ["/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.editable]
packages = ["finatic_server_python", "finatic_server", "src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = 'src/openapi/finatic_server'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = "(?x)(^tests/|^demo-app/|^src/openapi/finatic_server/)"
# Relaxed settings for generated code
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
# Allow untyped calls in generated code
disallow_untyped_calls = false
# Allow untyped decorators
disallow_untyped_decorators = false
# Show error codes
show_error_codes = true

# Generated OpenAPI code and smoke tests are not held to the same mypy bar as hand-written SDK code.
[[tool.mypy.overrides]]
module = ["finatic_server.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.FinaticServerCore",
    "src.wrappers.*",
    "src.utils.enum_coercion",
    "src.utils.logger",
    "src.utils.pagination",
]
ignore_errors = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "src/openapi/finatic_server",
]
import-order-style = "google"
application-import-names = ["src"]

[tool.ruff]
exclude = ["src/openapi/finatic_server"]

[tool.pytest.ini_options]
markers = ["integration: live-stack tests requiring finaticAPI + Supabase"]
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "src/v1.py",
    "src/FinaticServerCore.py",
    "src/config.py",
    "src/utils",
    "src/internal",
    "finatic_server_python",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "src/openapi/finatic_server/*",
]

[tool.coverage.report]
fail_under = 50
precision = 1
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
# Star re-exports from OpenAPI client package; names are re-exported intentionally.
"src/__init__.py" = ["F403", "F401", "F405"]
